<html>
<head>

    <title>Seed Coin Packages - Friendoo</title>
    <script type="module">
        import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "REDACTED_WEB_API_KEY",
            authDomain: "friendoo-v1.firebaseapp.com",
            projectId: "friendoo-v1",
            storageBucket: "friendoo-v1.firebasestorage.app",
            messagingSenderId: "6451131397",
            appId: "1:6451131397:web:b9faf2c8cc20483c96d86c"
        };
        
        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const coinPackages = [
            {
                id: 'starter',
                name: 'Starter',
                nameHi: 'स्टार्टर',
                nameTa: 'ஸ்டார்டர்',
                nameTe: 'స్టార్టర్',
                nameKn: 'ಸ್ಟಾರ್ಟರ್',
                nameMl: 'സ്റ്റാർട്ടർ',
                nameUr: 'اسٹارٹر',
                priceINR: 99,
                coins: 100,
                bonusPercent: 0,
                popular: false,
                description: '₹1 per coin. Good for 20 min Normal call. Entry pack.',
                order: 1,
                active: true
            },
            {
                id: 'popular',
                name: 'Popular',
                nameHi: 'पॉपुलर',
                nameTa: 'பாப்புலர்',
                nameTe: 'పాపులర్',
                nameKn: 'ಪಾಪುಲರ್',
                nameMl: 'പോപ്പുലർ',
                nameUr: 'مشہور',
                priceINR: 449,
                coins: 500,
                bonusPercent: 10,
                popular: true,
                description: '10% bonus coins. Good for 100 min Normal call. Most purchased.',
                order: 2,
                active: true
            },
            {
                id: 'best-value',
                name: 'Best Value',
                nameHi: 'बेस्ट वैल्यू',
                nameTa: 'சிறந்த மதிப்பு',
                nameTe: 'బెస్ట్ వాల్యూ',
                nameKn: 'ಬೆಸ್ಟ್ ವ್ಯಾಲ್ಯೂ',
                nameMl: 'ബെസ്റ്റ് വാല്യു',
                nameUr: 'بہترین قدر',
                priceINR: 999,
                coins: 1200,
                bonusPercent: 20,
                popular: false,
                description: '20% bonus coins. Good for 4 hours Normal call. Best deal.',
                order: 3,
                active: true
            },
            {
                id: 'premium',
                name: 'Premium',
                nameHi: 'प्रीमियम',
                nameTa: 'பிரீமியம்',
                nameTe: 'ప్రీమియం',
                nameKn: 'ಪ್ರೀಮಿಯಂ',
                nameMl: 'പ്രീമിയം',
                nameUr: 'پریمیم',
                priceINR: 1999,
                coins: 2500,
                bonusPercent: 25,
                popular: false,
                description: '25% bonus coins. Good for 8+ hours Normal call. VIP badge included.',
                order: 4,
                active: true,
                perks: ['VIP Badge', 'Priority Support']
            }
        ];
        
        async function seedCoinPackages() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p>Seeding coin packages...</p>';
            
            try {
                for (const pkg of coinPackages) {
                    await setDoc(doc(db, 'coinPackages', pkg.id), {
                        ...pkg,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    statusDiv.innerHTML += `<p>✅ Added: ${pkg.name} (₹${pkg.priceINR} for ${pkg.coins} coins)</p>`;
                }
                statusDiv.innerHTML += '<p><strong>All coin packages seeded successfully!</strong></p>';
            } catch (error) {
                statusDiv.innerHTML += `<p style="color:red">❌ Error: ${error.message}</p>`;
                console.error(error);
            }
        }
        
        window.seedCoinPackages = seedCoinPackages;
    </script>
    <style>

        h1 { color: #7c5cff; }
        button { background: linear-gradient(135deg, #7c5cff, #ff7ab6); color: white; border: none; padding: 15px 30px; border-radius: 999px; font-size: 16px; cursor: pointer; font-weight: 700; }
        button:hover { transform: translateY(-2px); }
        #status { margin-top: 30px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #7c5cff; }
        .badge { background: #ffd700; color: #000; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }

</body>
</html>
