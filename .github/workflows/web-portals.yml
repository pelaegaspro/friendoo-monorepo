name: Web Portals CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'admin/**'
      - 'crm/**'
      - '.github/workflows/web-portals.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'admin/**'
      - 'crm/**'
      - '.github/workflows/web-portals.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        portal: [admin, crm]
    defaults:
      run:
        working-directory: ./${{ matrix.portal }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.portal }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

      - name: Build Next.js
        run: npm run build
