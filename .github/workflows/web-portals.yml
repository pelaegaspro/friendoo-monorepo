name: Web Portals CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'admin/**'
      - 'crm/**'
      - '.github/workflows/web-portals.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'admin/**'
      - 'crm/**'
      - '.github/workflows/web-portals.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        portal: [admin, crm]
    defaults:
      run:
        working-directory: ./${{ matrix.portal }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.portal }}/package-lock.json'

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high


      - name: Run Lint
        run: npm run lint --if-present

      - name: Build Next.js
        run: npm run build
