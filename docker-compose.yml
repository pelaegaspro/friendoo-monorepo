version: '3.9'

services:
  # 1. Edge Reverse Proxy & Load Balancer (SSL Termination, Rate Limiting, Header Security)
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: friendoo-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      admin:
        condition: service_healthy
      crm:
        condition: service_healthy
    networks:
      - friendoo_edge
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # 2. Admin Portal Service (Next.js Standalone, Non-root)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: friendoo-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./admin/.env.local
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - friendoo_edge
      - friendoo_internal
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # 3. CRM Dashboard Service (Next.js Standalone, Non-root)
  crm:
    build:
      context: ./crm
      dockerfile: Dockerfile
    container_name: friendoo-crm
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./crm/.env.local
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - friendoo_edge
      - friendoo_internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 128M

  # 4. Redis Cache-Aside Layer (Strict Memory Limits & LRU Eviction)
  redis:
    image: redis:7-alpine
    container_name: friendoo-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 300
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - friendoo_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

networks:
  friendoo_edge:
    driver: bridge
  friendoo_internal:
    internal: true
    driver: bridge

