allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

def applyNamespaceFromManifest = { subproject ->
    def androidExtension = subproject.extensions.findByName('android')
    if (androidExtension == null || !androidExtension.hasProperty('namespace') || androidExtension.namespace) {
        return
    }

    def manifestFile = file("${subproject.projectDir}/src/main/AndroidManifest.xml")
    if (!manifestFile.exists()) {
        return
    }

    def manifest = new XmlSlurper().parse(manifestFile)
    def manifestPackage = manifest.@package.text()
    if (manifestPackage) {
        androidExtension.namespace = manifestPackage
    }
}

subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        applyNamespaceFromManifest(subproject)
    }
    subproject.plugins.withId('com.android.application') {
        applyNamespaceFromManifest(subproject)
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}
