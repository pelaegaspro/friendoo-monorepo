name: friendoo
description: Connect. Chat. Earn.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3

  # Notifications
  flutter_local_notifications: ^19.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Calls
  agora_rtc_engine: ^6.3.2
  cloud_functions: ^5.1.0

  # Payments
  razorpay_flutter: ^1.3.6

  # ML Kit
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_commons: ^0.8.1

  # Camera & Media
  camera: ^0.11.0
  image_picker: ^1.1.2

  # Audio
  speech_to_text: ^7.0.0

  # Ads
  google_mobile_ads: ^5.1.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  pinput: ^5.0.0

  # Utils
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/avatars/
    - assets/images/
